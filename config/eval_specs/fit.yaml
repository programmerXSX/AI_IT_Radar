id: fit
display_name: "Lab Fit"
weight: 0.25
rubric:
  0: "Unrelated to any anchor topic; no realistic Lab use case."
  1: "Tangentially related; useful only as background reading."
  2: "Adjacent to a Lab interest; might inspire a side project."
  3: "Directly relevant to one anchor topic; a plausible candidate to try."
  4: "Hits multiple Lab anchors; high marginal value to ongoing work."
  5: "Strategic — directly enables or threatens a current Lab roadmap item."

rag_neighbors_k: 3

prompt_template: |
  You are evaluating LAB FIT for the internal AI Lab below.

  ## Lab profile
  {{ lab_profile_summary }}

  Anchor topics & weights:
  {% for a in anchors %}- {{ a.topic }} (w={{ a.weight }}): {{ a.keywords | join(", ") }}
  {% endfor %}
  Auto-learned topics:
  {% for a in auto_learned %}- {{ a.topic }} (w={{ a.weight }})
  {% endfor %}

  ## Candidate
  Title: {{ title }}
  Type: {{ kind }}
  Summary: {{ summary }}

  Content excerpt:
  {{ content }}

  ## Task
  Score LAB FIT 0-5 using the rubric. Justify by mapping concrete capabilities of the
  candidate to specific anchor topics. Quote source content for each capability claimed.

  Rubric:
  {% for k, v in rubric.items() %}- {{ k }}: {{ v }}
  {% endfor %}

  Output STRICT JSON:
  {
    "score": <int>, "confidence": <float>,
    "rationale": "<...>", "quote": "<...>",
    "matched_topics": ["..."]
  }
