id: maturity
display_name: "Engineering Maturity"
weight: 0.25
rubric:
  0: "Toy/demo only; no tests, no docs, no concrete usage path."
  1: "Research-prototype quality; runs but obviously experimental."
  2: "Usable with effort; partial docs/tests; rough edges visible."
  3: "Production-leaning; clear quickstart, some test coverage, active commits."
  4: "Production-ready in real users' hands; documented release process, CI, examples."
  5: "Battle-tested at scale; mature ecosystem, version policy, multiple integrations."

rag_neighbors_k: 5

prompt_template: |
  You are evaluating the ENGINEERING MATURITY of an AI resource.

  ## Candidate
  Title: {{ title }}
  URL: {{ url }}
  Type: {{ kind }}
  Repo metadata: stars={{ stars or "n/a" }}, last_commit={{ last_commit or "n/a" }}, license={{ license or "n/a" }}

  ## Source content (README / repo signals)
  {{ content }}

  ## Reference anchors
  {% for n in neighbors %}
  - {{ n.title }} -> we scored maturity {{ n.score }} ({{ n.rationale }})
  {% endfor %}

  ## Task
  Score ENGINEERING MATURITY on 0-5. Anchor strongly on observable signals: tests,
  docs structure, release cadence, install path, license. Quote at least one concrete
  sentence/snippet to back the score. If signals are absent, score low rather than guess.

  Rubric:
  {% for k, v in rubric.items() %}- {{ k }}: {{ v }}
  {% endfor %}

  Output STRICT JSON:
  { "score": <int>, "confidence": <float>, "rationale": "<...>", "quote": "<...>" }
