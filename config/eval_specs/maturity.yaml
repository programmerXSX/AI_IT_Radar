id: maturity
display_name: "Engineering Maturity"
weight: 0.25
rubric:
  0: "仅玩具/演示级别；无测试、无文档、无具体使用路径。"
  1: "研究原型质量；能跑但明显是实验性的。"
  2: "需要一定努力才能使用；部分文档/测试；可见粗糙之处。"
  3: "倾向于生产级；有清晰的快速入门、一定测试覆盖、活跃提交。"
  4: "有真实用户使用的生产级别；有文档化的发布流程、CI、示例。"
  5: "大规模实战验证；成熟的生态系统、版本策略、多种集成。"

rag_neighbors_k: 5

prompt_template: |
  你正在评估一份 AI 资源的 ENGINEERING MATURITY（工程成熟度）。

  ## 候选条目
  Title: {{ title }}
  URL: {{ url }}
  Type: {{ kind }}
  仓库元数据: stars={{ stars or "n/a" }}, last_commit={{ last_commit or "n/a" }}, license={{ license or "n/a" }}

  ## 源内容（README / 仓库信号）
  {{ content }}

  ## 参考锚点
  {% for n in neighbors %}
  - {{ n.title }} -> 此前 maturity 评分 {{ n.score }} （{{ n.rationale }}）
  {% endfor %}

  ## 任务
  对 ENGINEERING MATURITY 进行 0-5 评分。重点依据可观测的信号：测试覆盖、文档结构、
  发布节奏、安装路径、许可证。至少引用一句具体的句子或代码片段来支撑评分。
  如果信号缺失，请打低分而非猜测。

  Rubric:
  {% for k, v in rubric.items() %}- {{ k }}: {{ v }}
  {% endfor %}

  输出 STRICT JSON：
  { "score": <int>, "confidence": <float>, "rationale": "<...>", "quote": "<...>" }
