id: reproduction_cost
display_name: "Reproduction Cost"
weight: 0.15
# Note: HIGHER score == LOWER cost (i.e. more attractive). The aggregator inverts naturally.
rubric:
  0: "几乎不可行：海量算力 / 封闭数据 / 未公开步骤。"
  1: "需要数周、大量 GPU 预算；大量工程工作。"
  2: "单张 A100/H100 上几天；设置不简单。"
  3: "单 GPU 上数小时；有已发布的 checkpoint / 脚本可用。"
  4: "消费级 GPU 上几分钟；可 pip 安装；有清晰的 demo。"
  5: "极其简单：托管端点或一行安装命令，内置默认配置。"

rag_neighbors_k: 3

prompt_template: |
  你正在估算 REPRODUCTION COST（复现成本，注意：分数越高 = 越容易复现）。

  ## 候选条目
  Title: {{ title }}
  Type: {{ kind }}
  License: {{ license or "n/a" }}

  ## 内容（关注：安装步骤、硬件提及、checkpoint 链接、数据集访问方式）
  {{ content }}

  ## 参考锚点
  {% for n in neighbors %}- {{ n.title }} -> reproduction_cost {{ n.score }} ({{ n.rationale }})
  {% endfor %}

  ## 任务
  进行 0-5 评分（分数越高 = 越容易复现）。引用具体的信号（例如 "uses 8xH100"、
  "pip install ..."、"no training script provided"）。如果信息不明确，默认给 2 分，
  并在 rationale 中注明 "INSUFFICIENT_CONTENT"。

  Rubric:
  {% for k, v in rubric.items() %}- {{ k }}: {{ v }}
  {% endfor %}

  输出 STRICT JSON：
  { "score": <int>, "confidence": <float>, "rationale": "<...>", "quote": "<...>" }
